name: Audomatick Desktop CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      correlation_key:
        description: 'FACON build correlation key'
        required: false
        default: ''
      commit_sha:
        description: 'Commit SHA'
        required: false
        default: 'HEAD'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Build, Test & Package Desktop
        shell: pwsh
        run: |
          ./build.ps1 -Configuration Release -Version "1.0.0-${{ github.run_number }}" -Pack

      - name: Archive Velopack Releases
        uses: actions/upload-artifact@v4
        with:
          name: velopack-releases
          path: artifacts/releases/
